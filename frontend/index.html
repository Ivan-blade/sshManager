<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sshManager</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部功能页导航（会话 / 后续功能页预留） -->
    <header id="topnav">
      <div class="brand">
        <span class="brand-mark">›</span>
        <span class="brand-name">sshManager</span>
      </div>
      <nav class="topnav-items">
        <button class="topnav-item active">会话</button>
      </nav>
    </header>
    <!-- 全宽操作栏（横跨整个屏幕，不局限于左侧列表） -->
    <div class="actionbar">
      <button id="btn-import" class="btn ghost">导入</button>
      <button id="btn-export" class="btn ghost">导出</button>
      <button id="btn-bg" class="btn ghost bg-toggle" title="后台保活 SSH 连接">◔ 后台连接 <span id="bg-count">0</span></button>
    </div>
    <div id="body">
      <!-- 左侧会话面板 -->
      <aside id="panel">
        <div class="panel-search">
          <input id="filter" type="text" placeholder="搜索名称 / IP…">
          <button id="btn-new" class="quick-btn" title="新建会话"><span class="plus">＋</span>会话</button>
          <button id="btn-add-group" class="quick-btn" title="新建分组"><span class="plus">＋</span>分组</button>
        </div>
        <nav id="tree" class="tree"></nav>
      </aside>

      <!-- 主区 -->
      <main id="main">
        <div id="tabbar">
          <div id="tabs" class="tabs"></div>
          <button id="tab-sftp" class="icon-btn tab-sftp" title="SFTP 文件（当前会话）">
            <svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
              <path d="M1.5 4a1 1 0 0 1 1-1h3.1l1.5 1.5h7.4a1 1 0 0 1 1 1v5.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/>
            </svg>
          </button>
        </div>
        <div id="main-body">
          <div id="term-col">
            <div id="terminal-wrap" class="hidden">
              <div id="terminal"></div>
            </div>
            <div id="empty-state">
              <div class="empty-glyph">⎇</div>
              <p>在左侧选择一个会话，打开终端</p>
              <button id="empty-new" class="btn primary">＋ 新建会话</button>
            </div>
          </div>
          <!-- SFTP 文件面板 -->
          <aside id="sftp-panel" class="hidden">
            <div class="sftp-head">
              <span class="sftp-title">SFTP · <span id="sftp-name"></span></span>
              <button id="sftp-close" class="icon-btn" title="关闭">✕</button>
            </div>
            <div class="sftp-pathbar">
              <input id="sftp-path" value="." spellcheck="false">
              <button id="sftp-go" class="btn small" title="前往">前往</button>
              <button id="sftp-up" class="btn small" title="上级目录">↑</button>
            </div>
            <div class="sftp-searchbar">
              <input id="sftp-search" placeholder="递归搜索文件…" spellcheck="false">
              <button id="sftp-search-btn" class="btn small" title="递归搜索当前目录">搜索</button>
            </div>
            <div id="sftp-list" class="sftp-list"></div>
            <div class="sftp-actions">
              <button id="sftp-upload" class="btn small">上传文件</button>
              <input type="file" id="sftp-file-input" class="hidden">
            </div>
          </aside>
        </div>
        <!-- 快捷命令栏 -->
        <section id="quickbar">
          <div class="quickbar-inner">
            <div class="quick-left">
              <button id="quick-group-btn" class="quick-group-btn">默认分组 ▾</button>
            </div>
            <div class="quick-right">
              <div id="quick-cmds" class="quick-cmds"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- 通用输入弹窗（新建分组 / 重命名） -->
  <div id="modal-prompt" class="modal hidden">
    <div class="modal-box">
      <h3 id="mp-title"></h3>
      <input id="mp-input" autocomplete="off">
      <div class="modal-actions">
        <button class="btn ghost" data-close>取消</button>
        <button id="mp-ok" class="btn primary">确定</button>
      </div>
    </div>
  </div>

  <!-- 移动分组弹窗 -->
  <div id="modal-move" class="modal hidden">
    <div class="modal-box">
      <h3>移动到分组</h3>
      <select id="mm-select"></select>
      <div class="modal-actions">
        <button class="btn ghost" data-close>取消</button>
        <button id="mm-ok" class="btn primary">移动</button>
      </div>
    </div>
  </div>

  <!-- 新建会话 -->
  <div id="modal-new" class="modal hidden">
    <div class="modal-box">
      <h3 id="n-title">新建会话</h3>
      <label>名称 <input id="n-name" required placeholder="例如：生产服务器" autocomplete="off"></label>
      <label>分组
        <select id="n-group">
          <option value="">无分组</option>
        </select>
      </label>
      <label>传输
        <select id="n-transport">
          <option value="ssh">SSH（远程）</option>
          <option value="local">本地 Shell（开发验证）</option>
        </select>
      </label>
      <div class="n-ssh">
        <div class="form-grid">
          <label>主机 <input id="n-host" value="localhost" autocomplete="off"></label>
          <label>端口 <input id="n-port" type="number" value="22"></label>
        </div>
        <label>用户名 <input id="n-user" value="root" autocomplete="off"></label>
        <label>认证
          <select id="n-auth">
            <option value="password">密码</option>
            <option value="key">SSH 密钥</option>
          </select>
        </label>
        <label id="n-password-wrap">密码 <input id="n-password" type="password" autocomplete="new-password"></label>
        <label id="n-key-wrap" class="hidden">密钥路径 <input id="n-key" placeholder="~/.ssh/id_rsa" autocomplete="off"></label>
      </div>
      <label>描述 <input id="n-desc" autocomplete="off"></label>
      <div class="modal-actions">
        <button class="btn ghost" data-close>取消</button>
        <button id="n-submit" class="btn primary">创建</button>
      </div>
    </div>
  </div>

  <!-- 导出会话/分组 -->
  <div id="modal-export" class="modal hidden">
    <div class="modal-box">
      <h3>导出</h3>
      <div class="exp-section">
        <div class="exp-head"><span>分组</span><button id="exp-groups-all" class="link-btn">全选</button></div>
        <div id="exp-groups" class="exp-list"></div>
      </div>
      <div class="exp-section">
        <div class="exp-head"><span>会话</span><button id="exp-sessions-all" class="link-btn">全选</button></div>
        <div id="exp-sessions" class="exp-list"></div>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" data-close>取消</button>
        <button id="exp-clipboard" class="btn ghost">复制到剪贴板</button>
        <button id="exp-file" class="btn primary">下载文件</button>
      </div>
    </div>
  </div>

  <!-- 快捷命令 -->
  <div id="modal-quick" class="modal hidden">
    <div class="modal-box">
      <h3 id="qc-title">新建命令</h3>
      <label>分组
        <select id="qc-group"></select>
      </label>
      <label>名称 <input id="qc-name" placeholder="例如：查看内存" autocomplete="off"></label>
      <label>命令 <textarea id="qc-command" class="qc-cmd-input" placeholder="例如：free -h（末尾加换行则点击时直接执行）"></textarea></label>
      <div class="modal-actions">
        <button class="btn ghost" data-close>取消</button>
        <button id="qc-ok" class="btn primary">确定</button>
      </div>
    </div>
  </div>

  <!-- 导入 -->
  <div id="modal-import" class="modal hidden">
    <div class="modal-box">
      <h3>导入</h3>
      <div id="i-drop" class="drop-zone">
        <p class="dz-hint">拖拽 JSON 文件到此处，或从以下来源读取</p>
        <div class="dz-actions">
          <button id="i-clipboard" class="btn ghost">从剪贴板读取</button>
          <button id="i-file" class="btn ghost">选择文件</button>
        </div>
      </div>
      <input type="file" id="i-file-input" class="hidden" accept=".json,application/json">
      <div id="i-preview" class="hidden">
        <div class="exp-section">
          <div class="exp-head"><span>将导入的分组</span></div>
          <div id="i-groups" class="exp-list"></div>
        </div>
        <div class="exp-section">
          <div class="exp-head"><span>将导入的会话</span></div>
          <div id="i-sessions" class="exp-list"></div>
        </div>
        <div class="modal-actions">
          <button id="i-cancel" class="btn ghost">取消</button>
          <button id="i-confirm" class="btn primary">确定导入</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 文件编辑 -->
  <div id="modal-file-edit" class="modal hidden">
    <div class="modal-box">
      <h3>编辑文件 · <span id="fe-name"></span></h3>
      <p class="hint" id="fe-path"></p>
      <textarea id="fe-text" spellcheck="false" class="fe-textarea"></textarea>
      <div class="modal-actions">
        <button class="btn ghost" data-close>取消</button>
        <button id="fe-save" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 快捷命令导出 -->
  <div id="modal-q-export" class="modal hidden">
    <div class="modal-box">
      <h3>Export Quick Commands</h3>
      <div class="exp-section">
        <div class="exp-head"><span>Groups</span><button id="qexp-groups-all" class="link-btn">Select All</button></div>
        <div id="qexp-groups" class="exp-list"></div>
      </div>
      <div class="exp-section">
        <div class="exp-head"><span>Commands</span><button id="qexp-commands-all" class="link-btn">Select All</button></div>
        <div id="qexp-commands" class="exp-list"></div>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" data-close>Cancel</button>
        <button id="qexp-clipboard" class="btn ghost">Copy to Clipboard</button>
        <button id="qexp-file" class="btn primary">Download File</button>
      </div>
    </div>
  </div>

  <!-- 快捷命令导入 -->
  <div id="modal-q-import" class="modal hidden">
    <div class="modal-box">
      <h3>Import Quick Commands</h3>
      <div id="qimp-drop" class="drop-zone">
        <p class="dz-hint">Drop JSON file here, or load from:</p>
        <div class="dz-actions">
          <button id="qimp-clipboard" class="btn ghost">From Clipboard</button>
          <button id="qimp-file" class="btn ghost">Choose File</button>
        </div>
      </div>
      <input type="file" id="qimp-file-input" class="hidden" accept=".json,application/json">
      <div id="qimp-preview" class="hidden">
        <div class="exp-section">
          <div class="exp-head"><span>Groups</span></div>
          <div id="qimp-groups" class="exp-list"></div>
        </div>
        <div class="exp-section">
          <div class="exp-head"><span>Commands</span></div>
          <div id="qimp-commands" class="exp-list"></div>
        </div>
        <div class="modal-actions">
          <button id="qimp-cancel" class="btn ghost">Cancel</button>
          <button id="qimp-confirm" class="btn primary">Import</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 快捷分组下拉（上拉） -->
  <div id="quick-group-menu" class="quick-group-menu hidden"></div>

  <!-- 右键菜单 -->
  <div id="ctxmenu" class="ctxmenu hidden"></div>

  <!-- 后台连接面板 -->
  <div id="bg-panel" class="bg-panel hidden">
    <div class="bg-panel-head">后台 SSH 连接</div>
    <div id="bg-list"></div>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
